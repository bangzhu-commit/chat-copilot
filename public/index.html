<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>把天聊下去 · AI 副驾</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ── 顶部工具栏 ─────────────────────────────────── -->
  <header class="toolbar">
    <div class="toolbar-left">
      <div class="brand-mark" aria-hidden="true">聊</div>
      <div class="brand-copy">
        <h1 class="app-title">把天聊下去</h1>
        <span class="app-subtitle">实时对话 AI 副驾</span>
      </div>
    </div>
    <div class="toolbar-center">
      <div class="audio-source">
        <label for="audioSource">音频源</label>
        <select id="audioSource">
          <option value="default">默认麦克风</option>
        </select>
      </div>
      <div class="scene-mode">
        <label for="sceneMode">场景</label>
        <select id="sceneMode" onchange="onSceneModeChange()">
          <option value="live-host" selected>直播主持</option>
          <option value="interview">访谈采访</option>
          <option value="recruitment">招聘面试（面试官）</option>
          <option value="candidate-interview">求职面试</option>
          <option value="sales-negotiation">销售谈判</option>
          <option value="dating">相亲约会</option>
          <option value="ai-judge">AI 应用评审</option>
          <option value="recording">口播录制</option>
          <option value="training">培训教学</option>
          <option value="custom">自定义</option>
        </select>
      </div>
      <button id="btnToggle" class="btn btn-primary" onclick="toggleRecording()">
        开始
      </button>
      <label class="btn btn-secondary upload-btn">
        上传资料
        <input type="file" id="fileInput" accept=".txt,.md" hidden onchange="uploadScript(this)">
      </label>
      <button class="btn btn-accent" onclick="manualTrigger()">
        手动追问
      </button>
      <button id="btnDeepTrigger" class="btn btn-deep" onclick="manualDeepTrigger()" style="display: none;">
        深度追问
      </button>
      <button id="btnDeepAuto" class="btn-small btn-deep-toggle" onclick="toggleDeepMode()" style="display: none;">
        自动深度：关
      </button>
      <button id="btnInterviewReview" class="btn btn-secondary btn-review" onclick="generateInterviewReview()" style="display: none;">
        面试复盘
      </button>
      <button id="btnJudgingScore" class="btn btn-secondary btn-review" onclick="generateJudgingScore()" style="display: none;">
        生成评分表
      </button>
      <button id="btnExportReview" class="btn btn-secondary btn-export" onclick="exportReviewPackage('manual')">
        导出复盘包
      </button>
    </div>
    <div id="customPromptRow" class="custom-prompt-row" style="display: none;">
      <label for="customPrompt">自定义指令</label>
      <textarea id="customPrompt" class="custom-prompt-input" rows="2" placeholder="输入自定义指令，例如：请用英文追问、侧重技术深度..."></textarea>
    </div>
    <div class="toolbar-right">
      <span id="scriptStatus" class="script-status"></span>
    </div>
  </header>

  <!-- ── 主内容区 ────────────────────────────────────── -->
  <main class="main-content">
    <!-- 左侧：追问建议 -->
    <section class="panel panel-suggestions">
      <div class="panel-header">
        <h2><span id="suggestionPanelLabel" class="panel-label">Cue</span><span id="suggestionPanelTitle">AI 追问建议</span></h2>
        <span id="suggestionCount" class="badge">0</span>
      </div>
      <div id="suggestionsContainer" class="suggestions-list">
        <div class="empty-state">
          <p>等待追问建议</p>
          <p class="hint">有对话内容后可自动生成，也可手动触发</p>
        </div>
      </div>
    </section>

    <!-- 右侧：实时转写 -->
    <section class="panel panel-transcript">
      <div class="panel-header">
        <h2><span class="panel-label">Live</span>实时语音转写</h2>
        <div class="transcript-actions">
          <span id="charCount" class="badge">0 字</span>
          <button class="btn-small" onclick="clearTranscript()">清空</button>
          <button class="btn-small" id="btnScrollLock" onclick="toggleScrollLock()">自动滚动：开</button>
        </div>
      </div>
      <div id="speakerRoleControls" class="speaker-role-controls" hidden></div>
      <div id="transcriptContainer" class="transcript-list">
        <div class="empty-state">
          <p>等待语音输入</p>
          <p class="hint">转写结果会实时显示在这里</p>
        </div>
      </div>
    </section>
  </main>

  <!-- ── 底部状态栏 ──────────────────────────────────── -->
  <footer class="statusbar">
    <div class="status-left">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">就绪</span>
    </div>
    <div class="status-center">
      <span id="asrStatus">ASR: 未启动</span>
      <span class="separator">|</span>
      <span id="llmStatus">LLM: 待命</span>
    </div>
    <div class="status-right">
      <span id="elapsedTime">00:00:00</span>
    </div>
  </footer>

  <script src="question-quality.js"></script>
  <script src="app.js"></script>
</body>
</html>
